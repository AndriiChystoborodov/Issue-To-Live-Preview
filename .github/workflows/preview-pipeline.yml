name: Elio Tax Interactive Pipeline Engine

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
  issue_comment:
    types: [created]

jobs:
  # JOB 1: Automatically open the PR when you push your 'sadullah' side branch
  create-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Auto-Create Active Staging PR
        env:
          # we use secrets.GITHUB_TOKEN is automatically provided by GitHub Actions and rotates per workflow.

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          echo "Checking active PR status for branch: ${{ github.ref_name }}"
          EXISTING_PR=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "🔍 Review Needed: ${{ github.ref_name }}" \
              --body "### 📡 Staging Bot Active! \nTest the bot responses directly inside Slack. \n\nWhen ready to deploy to production, reply to this PR with the comment: \n\`/approve-merge\`"
          fi

  # JOB 2: Listen for your '/approve-merge' comment, then merge and clean up the side branch
  human-approved-merge:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '/approve-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Entire Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches master history so the merge succeeds cleanly

      - name: Execute Authorized Merge and Cleanup
        env:
          GH_TOKEN: ${{ secrets.TEAM_PIPELINE_TOKEN }}
        run: |
          PR_NUM="${{ github.event.issue.number }}"
          echo "🚀 Human approval detected by @${{ github.actor }} on PR #${PR_NUM}. Commencing release..."
          
          # Merges into master and deletes the 'sadullah' tracking branch from the repository layout
          gh pr merge $PR_NUM --merge --delete-branch --admin
          echo "🎉 Production release complete. Staging server safely recycled."